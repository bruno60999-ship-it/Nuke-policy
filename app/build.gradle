plugins {
    id 'com.android.application'
}

android {
    namespace 'com.politicanuclear.juego'
    compileSdk 33

    defaultConfig {
        applicationId "com.politicanuclear.juego"
        minSdk 21          // Android 5.0 o superior (tu J7 con Android 8.1 es API 27)
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
